<!DOCTYPE html>
<html>
<head>
  <title>Raydium AMM Logs</title>
</head>
<body>
  <h1>实时 AMM 日志</h1>
  <pre id="logs"></pre>

  <script>
    const ws = new WebSocket("ws://127.0.0.1:3030/ws");
    const pre = document.getElementById("logs");

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      pre.textContent = JSON.stringify(data, null, 2);
    };
  </script>
</body>
</html>
